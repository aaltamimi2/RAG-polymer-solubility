name: statistics-ml
description: "Statistics and ML specialist. Use for: statistical summaries with confidence intervals, correlation analysis, regression, group comparisons (hypothesis testing), HSP/RED binary solubility screening using Hansen Solubility Parameters, HSP radar / RED gauge / Hansen sphere visualizations for a polymer-solvent pair, glass transition temperature (Tg) lookup, polymer thermal property prediction (Tm, delta Hf, delta Cp) for new polymers.\n"
routing:
  priority: 8
  phrases:
  - statistical summary
  - confidence interval
  - hansen parameter
  - hsp radar
  - radar plot
  - hansen sphere
  - red gauge
  - ml predict
  - hsp solubility prediction
  - hansen solubility
  - glass transition
  - glass transition temperature
  - lookup\s+tg
  - predict\s+tg
  - \btg\s+of\b
  - thermal properties
  - new polymer
  - novel polymer
  - unknown polymer
  - psmiles
  - melting temperature prediction
  - predict tm
  - predict thermal
  - enthalpy of fusion
  - heat capacity prediction
  - generate solubility
  - polymer not in database
  high_stems:
  - anova
  - regression
  - psmiles
  - thermal
  - enthalpy
  low_stems:
  - statistic
  - correlation
  - hypothesis
  - machine learning
  - novel
  negatives: []
planning:
  goals:
  - statistics.analysis
  - ml.prediction
  - thermal.prediction
  produces:
  - statistics.analysis.v1
  - ml.prediction.v1
  - thermal.prediction.v1
  requires:
