[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strap-agent"
version = "0.2.0"
description = "DISSOLVE: Data Integrated Solubility Solver via LLM Evaluation"
requires-python = ">=3.10"
dependencies = [
    "deepagents==0.3.10",
    "langgraph-checkpoint-sqlite",
    "langchain-anthropic",
    "langchain-google-genai",
    "langsmith",
    "duckdb",
    "pandas",
    "numpy",
    "scipy",
    "pyomo",
    "matplotlib",
    "seaborn",
    "plotly",
    "scikit-learn",
    "joblib",
    "pydantic>=2",
    "openpyxl",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-multipart",
    "rapidfuzz",
    "requests",
    "pyyaml",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = []
ml = [
    "torch>=2.0",
    "sentence-transformers>=3.0",
]
biosteam = [
    "biosteam>=2.50",
    "thermosteam>=0.50",
]
rag = [
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
]
literature = [
    "rdkit>=2023.0",
]
all = ["strap-agent[viz,ml,biosteam,rag,literature]"]

[project.scripts]
dissolve = "strap.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strap"]

[tool.hatch.build.targets.wheel.force-include]
"src/strap/AGENTS.md" = "strap/AGENTS.md"
"src/strap/subagents.yaml" = "strap/subagents.yaml"
"src/strap/skills" = "strap/skills"
